name: Android Release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate temporary CI signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass changeit123 \
            -alias mazkiplay-ci \
            -keypass changeit123 \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Mazkiplay Agent, OU=CI, O=Mazkiplay, L=NA, ST=NA, C=ID"

      - name: Build signed release APK
        working-directory: android
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=ci-release.keystore \
            -PRELEASE_STORE_PASSWORD=changeit123 \
            -PRELEASE_KEY_ALIAS=mazkiplay-ci \
            -PRELEASE_KEY_PASSWORD=changeit123

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Mazkiplay-Agent-v0.3.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazkiplay-agent-v0.3.2
          path: Mazkiplay-Agent-v0.3.2.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2
          name: Mazkiplay Agent v0.3.2
          body: |
            Mazkiplay Agent v0.3.2

            Android AI agent with direct OpenRouter support.
            Full-stack repository with optional Node/Express gateway under /server.

            Features:
            - Direct OpenRouter API from Android
            - User-provided API key stored locally on device
            - Configurable model, token limit and system prompt
            - Persistent conversation history
            - Plan, Job CV, Ideas and Translate quick actions
            - Token usage display

            The APK is signed with a temporary CI testing key for direct installation.
            Use a private production keystore before Google Play distribution.

            APK: Mazkiplay-Agent-v0.3.2.apk
          files: Mazkiplay-Agent-v0.3.2.apk
          generate_release_notes: true
