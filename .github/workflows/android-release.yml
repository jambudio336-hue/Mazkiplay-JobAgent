name: Android Release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Mazkiplay-Agent-v0.3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazkiplay-agent-v0.3.0
          path: Mazkiplay-Agent-v0.3.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Mazkiplay Agent v0.3.0
          body: |
            Mazkiplay Agent v0.3.0

            Android AI agent with direct OpenRouter support.

            Features:
            - Local OpenRouter API key configuration
            - Configurable model and max output tokens
            - Persistent local conversation history
            - Quick actions: Plan, Job CV, Ideas, Translate
            - Token usage display
            - No backend required for the Android chat path

            APK: Mazkiplay-Agent-v0.3.0.apk
          files: Mazkiplay-Agent-v0.3.0.apk
          generate_release_notes: true
